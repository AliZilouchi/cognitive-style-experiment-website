[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sepid-island-rag"
version = "0.6.0"
description = "Controlled Persian RAG backend for the Sepid Island Search-as-Learning study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "langchain-together>=0.3,<2",
  "langchain-groq>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "together>=1.3,<3",
  "openai>=1.60,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
