services:
  rag-api:
    build:
      context: .
      args:
        INSTALL_LOCAL_EMBEDDINGS: ${INSTALL_LOCAL_EMBEDDINGS:-true}
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - rag-index:/app/data/index
      - huggingface-cache:/app/data/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

volumes:
  rag-index:
  huggingface-cache:
