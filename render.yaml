services:
  - type: web
    name: sepid-rag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: experiment
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-large
      - key: EMBEDDING_REVISION
        value: openrouter-catalog-2026-08-25
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: QUERY_PREFIX
        value: "query:"
      - key: DOCUMENT_PREFIX
        value: "passage:"
      - key: TOP_K
        value: "5"
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_MAX_TOKENS
        value: "700"
      - key: ENABLE_DEBUG_RETRIEVAL
        value: "false"
      - key: INDEX_DIR
        value: /tmp/sepid-index
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: OPENROUTER_APP_TITLE
        value: Cognitive Style Experiment
      - key: API_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
